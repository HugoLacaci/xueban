# Publica la app en GitHub Pages (exportación estática) en cada push a main.
# La ruta API de vídeos (yt-dlp) no existe en Pages: se quita antes del build.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Caché de datos abiertos (CC-CEDICT, JMdict, KanjiVG, Wiktionary, Tatoeba…)
        uses: actions/cache@v4
        with:
          path: .cache/data
          key: open-data-${{ hashFiles('scripts/build-data.ts', 'scripts/data/**') }}
      - run: npm ci
      - name: Generar datos (public/data)
        run: npm run data:build
      - name: Build estático
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /xueban
        run: |
          rm -rf app/api
          npm run build
          node scripts/fix-export-prefetch.mjs out
          ls out | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
