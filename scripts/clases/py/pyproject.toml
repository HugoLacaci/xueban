[project]
name = "xueban-clases"
version = "0.1.0"
description = "Transcripción local de las clases (faster-whisper) para Xuébàn"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.2",
  "opencc-python-reimplemented>=0.1.7",
  # DLL de CUDA para CTranslate2 en Windows (GPU NVIDIA). Si no hay GPU, se usa CPU int8.
  "nvidia-cublas-cu12>=12.8,<12.9; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]

[tool.uv]
package = false
